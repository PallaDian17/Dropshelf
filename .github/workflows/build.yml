name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: >
          dotnet publish src/Dropshelf/Dropshelf.csproj -c Release -r ${{ matrix.rid }}
          --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o publish/${{ matrix.rid }}

      - name: Name the executable
        shell: pwsh
        run: Rename-Item publish/${{ matrix.rid }}/Dropshelf.exe Dropshelf-${{ matrix.rid }}.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Dropshelf-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}/Dropshelf-${{ matrix.rid }}.exe

  # Pushing a tag such as v1.0.0 publishes both executables as a GitHub release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" assets/*.exe
          --repo "${{ github.repository }}"
          --title "Dropshelf ${{ github.ref_name }}"
          --notes "Self-contained Windows builds: Dropshelf-win-x64.exe for Intel/AMD PCs, Dropshelf-win-arm64.exe for Snapdragon PCs. Nothing else to install. The files are unsigned, so SmartScreen may warn: choose More info, then Run anyway."
